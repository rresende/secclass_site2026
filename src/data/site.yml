# ---------------------------------------------------------------------
#  Versão atual e tabelas
# ---------------------------------------------------------------------
versao_atual:
  numero: "2.0"
  data: "julho de 2025"
  base: "Uniclass 2015 — abril de 2025"
  autores: "Ricardo Pontes Resende e Sara Parece (Iscte)"

tabelas:
  - { codigo: "Co", nome: "Complexos", termos: 417, descricao: "Grandes conjuntos do ambiente construído, definidos por propósito ou função (ex.: complexos hospitalares, portos)." }
  - { codigo: "En", nome: "Entidades", termos: 596, descricao: "Partes individuais de um ativo — edifícios, pontes, túneis — dentro de um complexo." }
  - { codigo: "SL", nome: "Espaços / locais", termos: 1146, descricao: "Espaços onde ocorrem atividades ou se localizam equipamentos (rooms/spaces no Revit)." }
  - { codigo: "EF", nome: "Elementos / funções", termos: 230, descricao: "Componentes principais e funções gerais; classificação macro em fases de LOIN baixo." }
  - { codigo: "Ss", nome: "Sistemas", termos: 2706, descricao: "Conjuntos de produtos que funcionam em conjunto para um fim comum." }
  - { codigo: "Pr", nome: "Produtos", termos: 8421, descricao: "Produtos individuais, de pequenos dispositivos a grandes equipamentos; projeto de execução e telas finais." }
  - { codigo: "Ma", nome: "Materiais", termos: 447, descricao: "Materiais de construção e outros." }
  - { codigo: "Ac", nome: "Atividades", termos: 948, descricao: "Atividades em ativos existentes ou a construir, ao longo do ciclo de vida." }
  - { codigo: "TE", nome: "Ferramentas e equipamentos", termos: 882, descricao: "Equipamentos e veículos de construção e manutenção." }
  - { codigo: "FI", nome: "Formas de informação", termos: 94, descricao: "Tipos de documentos: contratos, orçamentos, modelos 3D." }
  - { codigo: "PM", nome: "Gestão de projeto", termos: 1105, descricao: "Requisitos e registos: relatórios, certificados." }
  - { codigo: "Ro", nome: "Agentes", termos: 287, descricao: "Perfis individuais ou organizacionais: engenheiro, arquiteto, subempreiteiro." }
  - { codigo: "Zz", nome: "CAD", termos: 132, descricao: "Conteúdos CAD e de modelação: layers, linhas, símbolos, anotações." }

tabelas_nota: >-
  As tabelas Riscos e Propriedades e características do Uniclass serão traduzidas numa versão futura.
  O SECClasS inclui ainda termos específicos da realidade portuguesa (ex.: Co_20_60_99 — Centros e escolas de formação militar).

# ---------------------------------------------------------------------
#  Downloads (ficheiros alojados nas releases do repositório de dados)
# ---------------------------------------------------------------------
downloads:
  # destaque: true -> cartões grandes das Aplicações (por esta ordem)
  # icone: letra ou símbolo | pagina: link "Mais" (página do site) | descarregar: link direto "Descarregar"
  - titulo: "Tabelas SECClasS"
    icone: "▦"
    formato: "Excel (.xlsx) + instruções"
    descricao: "As 13 tabelas, com código, título em português e título Uniclass."
    pagina: "ferramentas-bim/#tabelas"
    descarregar: "https://github.com/rresende/secclass/releases/download/V2.0/Tabelas.SECClasS.V2.0.xlsx"
    destaque: true
  - titulo: "Tabelas para Autodesk Revit"
    icone: "R"
    formato: "Excel (.xlsx) + instruções"
    descricao: "Para o Autodesk Standardized Data Tool for Revit (antigas BIM Interoperability Tools)."
    pagina: "ferramentas-bim/#revit"
    descarregar: "https://github.com/rresende/secclass/releases/download/V2.0/SECClasS_V2.0_AutodeskInteroperabilityTools.xlsx"
    destaque: true
  - titulo: "Tabelas para Graphisoft Archicad"
    icone: "A"
    formato: "XML + instruções"
    descricao: "Tabelas no formato de classificação do Archicad, fornecidas pela Infor."
    pagina: "ferramentas-bim/#archicad"
    descarregar: "https://github.com/rresende/secclass/releases/download/V2.0/SECClasS.V2.0.para.Archicad.xml"
    destaque: true
  - titulo: "Exportação para IFC"
    icone: "IFC"
    formato: "Ficheiros de configuração + instruções"
    descricao: "Parâmetros e mapeamento para exportar a classificação SECClasS em IFC, a partir do Revit e do Archicad."
    pagina: "ferramentas-bim/#ifc"
    descarregar: "https://github.com/rresende/secclass/tree/main/ClassificationFiles/IFC_files"
    estado: "Em actualização"
    destaque: true
  - titulo: "Uniformat II em português"
    formato: "Excel (.xlsx) e tabela para Revit"
    descricao: "654 entradas, versões EN e PT. Tradução da Limsen Consulting com a Lipronerg Engenharia."
    pagina: "ferramentas-bim/#uniformat"

