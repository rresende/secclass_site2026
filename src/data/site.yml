# ---------------------------------------------------------------------
#  O projeto financiado (2020–2023)
# ---------------------------------------------------------------------
projeto:
  resumo: >-
    O SECClasS nasceu de um projeto de investigação financiado pelo EEA Grants (2020–2023), cujo objetivo era facilitar
    a Economia Circular na Construção através de um sistema de classificação da informação orientado para o BIM e para a
    sustentabilidade. O projeto analisou os sistemas existentes e selecionou o Uniclass 2015 (2021), traduziu-o e
    desenvolveu regras de modelação de objetos BIM (2021), criou aplicações web de apoio e promoveu
    ações de divulgação (2022). O evento final decorreu no LNEC a 12 de dezembro de 2022.
  coordenador: "Ricardo Pontes Resende (Iscte)"
  financiador:
    nome: "EEA Grants"
    url: "https://www.eeagrants.gov.pt/"
    logo: "img/eea-grants-branco.png"   # versão branca: usar sobre fundo escuro
    texto: >-
      Através do Acordo sobre o Espaço Económico Europeu, a Islândia, o Liechtenstein e a Noruega financiam, através do
      Mecanismo Financeiro EEA Grants, projetos que reduzem as disparidades sociais e económicas na Europa e reforçam as
      relações bilaterais com os países beneficiários.

