nome: "SECClasS"
nome_completo: "Sistema de Classificação da Construção Orientado para a Sustentabilidade"
nome_en: "Sustainability Enhanced Construction Classification System"
descricao: "O sistema de classificação da construção para Portugal, adaptado do Uniclass 2015 e alinhado com a EN ISO 12006-2. Aberto e gratuito."

# Logótipo: coloque o ficheiro em public/img/ e indique o caminho.
# Enquanto estiver vazio, o site usa o logótipo em texto.
