- titulo: "BIM e as regras de medição em Portugal"
  autores: ["Laura Almeida", "Filipe Lima", "Sébastien Roux", "Miguel Azenha"]
  instituicao: "Limsen Consulting; Universidade do Minho (ISISE)"
