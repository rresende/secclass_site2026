# --------------------------- Trabalhos que usam o SECClasS ---------------------------

- titulo: "A BIM-based tool for embodied carbon assessment using a Construction Classification System"
  autores: ["Sara Parece", "Ricardo Pontes Resende", "Vasco Rato"]
  instituicao: "Iscte – Instituto Universitário de Lisboa"
  local: "Developments in the Built Environment, vol. 19, 100467 (Elsevier, acesso aberto)"
  ano: 2024
  tipo: artigo
  categoria: terceiros
  resumo: "Propõe um método para avaliar o carbono incorporado a partir de modelos BIM classificados com um sistema de classificação da construção, que fornece a estrutura de dados, faz a correspondência entre objetos BIM e impactos ambientais em bases de dados de ACV e acomoda diferentes níveis de desenvolvimento (LoD). Testado em modelos reais (375 kgCO2e/m² numa moradia e 426 kgCO2e/m² num edifício multifamiliar), mostrou adaptar-se a diferentes LoD e técnicas de modelação e poupar até 20 horas de remodelação."
  papel_secclass: "O sistema de classificação é a linguagem comum entre o modelo BIM e as bases de dados de ACV: os códigos de classificação ligam cada objeto ao respetivo impacto ambiental."
  url: "https://doi.org/10.1016/j.dibe.2024.100467"
  ficheiro: ""
  estado: publicado
  fonte: "Crossref / OpenAlex"

- titulo: "As potencialidades e desafios da implementação BIM adaptada ao controlo de segurança estrutural de barragens de betão"
  autores: ["Carlos Serra"]
  instituicao: "LNEC"
  local: "4.º Congresso Português de Building Information Modelling (PTBIM 2022), Braga"
  ano: 2022
  tipo: comunicacao
  categoria: terceiros
  resumo: "Discute a aplicação da metodologia BIM ao controlo de segurança estrutural de barragens de betão — monitorização, interpretação dos resultados da observação e avaliação da segurança — e os requisitos de gestão da informação que daí decorrem."
  papel_secclass: "Adota o Uniclass 2015 proposto pelo SECClasS para o contexto português como base comum para identificar objetos e ligar o modelo BIM ao sistema de gestão da informação, e refere a ferramenta de pesquisa SECClasS."
  url: "https://doi.org/10.21814/uminho.ed.32.31"
  ficheiro: "docs/PTBIM2022_BIM-Barragens.pdf"
  estado: publicado
  fonte: "site SECClasS (2022)"

- titulo: "Modelação da informação e ferramenta digital orientadas à produção automática do MQT no contexto da disciplina de Arquitetura"
  autores: ["Lucas Vieira", "Marta Campos", "José Granja", "Miguel Azenha"]
  instituicao: "Universidade do Minho; Marta Campos Arquitetura"
  local: "4.º Congresso Português de Building Information Modelling (PTBIM 2022), Braga"
  ano: 2022
  tipo: comunicacao
  categoria: terceiros
  resumo: "Desenvolve um add-in para Revit (pyRevit/IronPython) que gera automaticamente o Mapa de Quantidades de Trabalho com especificações técnicas e estimativa de custo preliminar, a partir do modelo BIM e de uma base de dados de especificações estruturada por um sistema de classificação."
  papel_secclass: "Referido como o sistema de classificação nacional baseado no Uniclass 2015 em desenvolvimento, que estrutura a correspondência entre modelo e base de dados de especificações."
  url: "https://doi.org/10.21814/uminho.ed.32.17"
  ficheiro: "docs/PTBIM2022_MQT-Arquitetura.pdf"
  estado: publicado
  fonte: "site SECClasS (2022)"

- titulo: "Desenvolvimentos na automação da extração de quantidades – Projeto Metabuilding"
  autores: ["Filipe Lima", "Sébastien Roux", "Tiago Pedro", "Ricardo Pontes Resende"]
  instituicao: "Limsen Consulting; Iscte"
  local: "4.º Congresso Português de Building Information Modelling (PTBIM 2022), Braga"
  ano: 2022
  tipo: comunicacao
  categoria: terceiros
  resumo: "Apresenta uma aplicação online para visualização e auditoria de modelos e mapas de quantidades e dois plugins para Navisworks que, com a tradução portuguesa do Uniformat, automatizam a extração de quantidades a partir de modelos BIM."
  papel_secclass: "Trabalho cofinanciado pelo projeto SECClasS; usa a tradução portuguesa do Uniformat II disponibilizada no SECClasS."
  url: "https://doi.org/10.21814/uminho.ed.32.15"
  ficheiro: "docs/PTBIM2022_Metabuilding.pdf"
  estado: publicado
  fonte: "site SECClasS (2022)"

