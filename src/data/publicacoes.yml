# =====================================================================
#  Trabalhos que usam ou referem o SECClasS
#
#  Este ficheiro é alimentado de 15 em 15 dias pelo agente
#  (agent/procurar_publicacoes.py), que abre um pull request com
#  entradas no estado "proposta". Só aparecem no site as entradas com
#  estado "publicado": reveja, corrija e mude o estado antes de aprovar.
#
#  Campos:
#    titulo, autores (lista), instituicao, local (revista, congresso,
#    repositório), ano, tipo (artigo | comunicacao | dissertacao |
#    tese | relatorio | livro), categoria (projeto | terceiros),
#    resumo, papel_secclass, url (link direto para o trabalho),
#    ficheiro (opcional: PDF em public/docs/), estado, fonte, adicionado
# =====================================================================

