  resumo: "Desenvolve o protótipo de uma plataforma que permite a técnicos de licenciamento criar regulamentos digitais com programação visual por blocos e executar verificações de conformidade automáticas em modelos IFC."
  papel_secclass: "Usa o SECClasS para identificar os compartimentos (cozinha, varanda, sala) nas regras de verificação, por refletir as particularidades da construção portuguesa; aponta casos em que o sistema é incompleto para o domínio do licenciamento."
  url: "https://doi.org/10.21814/uminho.ed.164.13"
